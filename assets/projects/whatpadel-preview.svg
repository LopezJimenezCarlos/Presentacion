<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">WhatPadel preview placeholder</title>
  <desc id="desc">Placeholder visual para sustituir por un mockup real de WhatPadel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8f9"/>
      <stop offset="1" stop-color="#e5f3f5"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e6f82"/>
      <stop offset="1" stop-color="#0d171a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0b1720" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="56" fill="url(#bg)"/>
  <circle cx="1010" cy="138" r="140" fill="#dff3f6"/>
  <circle cx="170" cy="654" r="165" fill="#dbecea"/>
  <g filter="url(#shadow)">
    <rect x="260" y="155" width="680" height="430" rx="42" fill="url(#court)"/>
    <rect x="305" y="205" width="590" height="330" rx="22" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9"/>
    <line x1="600" y1="205" x2="600" y2="535" stroke="#ffffff" stroke-width="8" opacity="0.88"/>
    <line x1="305" y1="370" x2="895" y2="370" stroke="#ffffff" stroke-width="8" opacity="0.88"/>
    <line x1="450" y1="205" x2="450" y2="535" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
    <line x1="750" y1="205" x2="750" y2="535" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
    <circle cx="705" cy="300" r="30" fill="#dff36b"/>
    <g transform="translate(412 420) rotate(-22)">
      <ellipse cx="0" cy="0" rx="34" ry="72" fill="#ffffff" opacity="0.96"/>
      <rect x="-10" y="66" width="20" height="82" rx="10" fill="#0d171a"/>
    </g>
    <g transform="translate(790 255) rotate(28)">
      <ellipse cx="0" cy="0" rx="34" ry="72" fill="#ffffff" opacity="0.96"/>
      <rect x="-10" y="66" width="20" height="82" rx="10" fill="#0d171a"/>
    </g>
  </g>
  <text x="600" y="680" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#0b1720">WhatPadel</text>
  <text x="600" y="718" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#61717a">Sustituir por mockup real de la app</text>
